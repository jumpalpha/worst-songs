<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom Songs Are Closed · Worst Song Ever</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16121f; --panel:#211b2e; --line:#342b47;
    --text:#f5f1ff; --muted:#a99fbf; --accent:#ffc531; --ink:#16121f; --error:#ff2e88;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;line-height:1.45}
  .wrap{max-width:760px;margin:0 auto;padding:40px 16px 64px}
  .kicker{font-size:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(44px,9vw,76px);line-height:.95;margin:0 0 14px}
  h1 span{color:var(--accent)}
  .lead{font-size:18px;color:#D6D6D0;margin:0 0 20px}
  .price{display:inline-flex;align-items:baseline;gap:8px;background:var(--accent);color:var(--ink);border-radius:999px;padding:6px 18px;font-weight:700;margin-bottom:28px}
  .price b{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:28px}
  fieldset{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:22px 20px 8px;margin:0 0 20px}
  legend{font-family:'Anton',Impact,sans-serif;text-transform:uppercase;font-size:22px;letter-spacing:.02em;padding:0 8px;color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  @media (max-width:600px){.row{grid-template-columns:1fr}}
  .field{margin-bottom:18px}
  label,.qlabel{display:block;font-weight:700;margin-bottom:6px}
  .hint{display:block;font-weight:400;font-size:14px;color:var(--muted);margin-top:2px}
  .req{color:var(--accent)}
  input[type=text],input[type=email],input[type=tel],input[type=date],textarea{
    width:100%;font:inherit;color:var(--text);background:#111;border:2px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px}
  textarea{min-height:96px;resize:vertical}
  input[type=date]{color-scheme:dark;cursor:pointer;max-width:320px}
  input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;filter:invert(78%) sepia(60%) saturate(800%) hue-rotate(-5deg);width:22px;height:22px}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{position:relative}
  .chip input{position:absolute;opacity:0;width:1px;height:1px}
  .chip span{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border:2px solid #8A8A84;border-radius:999px;cursor:pointer;font-weight:500}
  .chip input:checked + span{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700}
  .chip input:disabled + span{opacity:.35;cursor:not-allowed}
  .chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:3px}
  .stack .chip span{width:100%;border-radius:12px}
  .stack{flex-direction:column}
  .count{font-size:14px;color:var(--muted);margin-top:8px}
  .check{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px;font-weight:500}
  .check input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
  .terms{font-size:15px;color:#D6D6D0;margin:0 0 14px;padding-left:18px}
  .terms li{margin-bottom:6px}
  .terms a{color:var(--accent)}
  .hp{position:absolute;left:-9999px}
  button{font:inherit;font-weight:700;font-size:20px;min-height:56px;padding:0 36px;border:0;border-radius:999px;background:var(--accent);color:var(--ink);cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .error{color:var(--error);font-weight:700;margin:12px 0 0;min-height:1.4em}
  .done{display:none;text-align:center;padding:40px 20px;border:2px solid var(--accent);border-radius:16px}
  .done h2{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:48px;margin:0 0 10px;color:var(--accent)}
  .done a{color:var(--accent)}
  .done a.paybtn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 32px;margin:8px 0;border-radius:999px;background:var(--accent);color:var(--ink);font-size:20px;font-weight:700;text-decoration:none}
  footer{margin-top:28px;font-size:14px;color:var(--muted);text-align:center}
  footer a{color:var(--muted)}
.wrap a.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;background:#ff0033;color:#fff;font-weight:700;text-decoration:none;margin:0 12px 12px 0}.wrap a.btn.alt{background:var(--accent);color:var(--ink)}</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">Worst Song Ever</p>
  <h1>Custom songs are <span>closed</span></h1>
  <p class="lead">We're not taking song requests anymore. There's a new Worst Song every day instead.</p>
  <p><a class="btn" href="https://www.youtube.com/@TheWorstSong?sub_confirmation=1" target="_blank" rel="noopener">&#128276; Subscribe on YouTube</a><a class="btn alt" href="/">Hear every Worst Song &rarr;</a></p>
</main>
</body>
</html>
